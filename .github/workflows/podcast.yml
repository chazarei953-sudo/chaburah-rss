name: Refresh Chaburah combined podcast RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '27 1,7,13,19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chaburah-podcast
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install libraries
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build the podcast feed
        run: python build_feed.py --batch-size ${{ github.event_name == 'workflow_dispatch' && '600' || '85' }} --concurrency 3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload podcast feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Wait for GitHub to register the upload
        run: sleep 30

      - name: Publish podcast feed
        id: deployment
        uses: actions/deploy-pages@v4
